[project]
name = "freecode"
version = "0.0.1"
description = "Terminal-based, MCP-driven AI coding agent built on ApiFreeLLM's free tier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FreeCode contributors" }]
keywords = ["tui", "llm", "agent", "apifreellm", "coding"]
dependencies = [
    "textual>=0.58",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
freecode = "freecode.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freecode = ["config/*.toml", "tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/A56-A5/freecode"
